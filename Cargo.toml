[package]
name = "sciplot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Makie-style plotting for Rust: Figure/Axis layouts, GPU (wgpu) windows with live updates, PNG and SVG export"
license = "MIT AND LPPL-1.3c"
publish = false
include = ["src/**", "assets/fonts/**", "LICENSE-MIT", "README.md"]

[features]
default = ["window", "cpu-png"]
window = ["dep:winit", "dep:objc2", "dep:objc2-quartz-core", "dep:objc2-core-graphics"]
cpu-png = ["dep:resvg"]
ndarray = ["dep:ndarray"]
testing = ["window"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }
winit = { version = "0.30.13", optional = true }
web-time = "1"
bytemuck = { version = "1.25.2", features = ["derive"] }
parking_lot = "0.12.5"
png = "0.18.1"
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
base64 = "0.23.1"
log = "0.4.34"
ndarray = { version = "0.17.2", optional = true }
resvg = { version = "0.48.1", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "vulkan", "dx12"] }
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "webgl"] }
# The CLI that post-processes the .wasm must match exactly (tools/web/build.sh installs it into .tools/).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Blob", "BlobPropertyBag", "CssStyleDeclaration", "Document", "DomRect", "Element", "HtmlAnchorElement",
    "HtmlCanvasElement", "HtmlElement", "Location", "Node", "Url", "Window",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-quartz-core = { version = "0.3", optional = true, default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", optional = true, default-features = false, features = ["std", "CGColorSpace"] }

[dev-dependencies]
# Already in the tree through wgpu; the GLSL ES 3.00 writer checks that every shader translates for WebGL2.
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-out"] }
serde_json = "1"
trybuild = "1"

# Native only: rand's getrandom needs extra configuration on wasm32, and the wasm examples use xorshift.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rand = "0.9"

[[test]]
name = "window_smoke"
harness = false
required-features = ["testing"]

# Plain `cargo run` / the editor's Run button builds the dev profile. Unoptimized, sciplot spends
# ~10x longer per frame (scene build ~4.5 ms vs 0.45 ms) and the examples' simulations ~15x
# longer, so live windows stutter. Optimize this package (its examples and tests too) and all
# dependencies; debug assertions and overflow checks stay on. Downstream crates need the same
# lines in their own Cargo.toml (`[profile.dev.package.sciplot]` or `"*"`).
[profile.dev.package.sciplot]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1

# Examples that open windows need the `window` feature.
[[example]]
name = "s1_show"
required-features = ["window"]

[[example]]
name = "s5_live"
required-features = ["window"]

[[example]]
name = "s5_animate"
required-features = ["window"]

[[example]]
name = "interact_check"
required-features = ["window"]

[[example]]
name = "lorenz3d"
required-features = ["window"]

[[example]]
name = "web_grayscott"
required-features = ["window"]

[[example]]
name = "web_lorenz"
required-features = ["window"]

[[example]]
name = "web_static"
required-features = ["window"]
