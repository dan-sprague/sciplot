<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>ezviz: static figure</title>
  <style>html, body { margin: 0; background: #fff; overflow: hidden; } #ezviz { display: block; }</style>
</head>
<body>
  <!-- No CSS size on purpose: fig.show_in("ezviz") gives the canvas the figure's size. -->
  <canvas id="ezviz"></canvas>
  <!-- The example appends <img id="png"> with Figure::to_png_bytes_async's output below. -->
  <script type="module">
    import init from './pkg/web_static.js';
    import { signalDone } from './harness.js';
    await init();
    signalDone({ frames: 10, waitFor: 'png' });
  </script>
</body>
</html>
